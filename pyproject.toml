[build-system]
requires = [
    "scikit-build-core>=0.11",
    "nanobind>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "cppdjango"
dynamic = ["version"]
requires-python = ">= 3.12"
dependencies = [
    "asgiref>=3.9.1",
    "sqlparse>=0.5.0",
    "tzdata; sys_platform == 'win32'",
]
authors = [
  {name = "Django Software Foundation and individual contributors"},
  {name = "cppdjango contributors"},
]
description = "A C++ port of Django 6.1 with native ORM and request-processing paths."
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSE.python", "AUTHORS"]
keywords = ["django", "cpp", "c++", "web framework", "orm", "postgresql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
argon2 = ["argon2-cffi>=23.1.0"]
bcrypt = ["bcrypt>=4.1.1"]
# Build-time helpers for contributors working on the native layer.
native-dev = [
    "scikit-build-core>=0.11",
    "nanobind>=2.13",
    "pytest>=8.0",
]

[project.scripts]
django-admin = "django.core.management:execute_from_command_line"

[project.urls]
Homepage = "https://django.goblinreactor.com/"
Documentation = "https://django.goblinreactor.com/#install"
Benchmarks = "https://django.goblinreactor.com/#numbers"
Source = "https://github.com/adamdeprince/cppdjango"
Tracker = "https://github.com/adamdeprince/cppdjango/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["django"]
# Prefer a modern CMake; Ninja is auto-selected when present.
cmake.version = "CMakeLists.txt"
ninja.make-fallback = true
# Rebuild the extension on import when sources change (editable installs).
editable.rebuild = true
editable.verbose = false
sdist.include = [
    "CMakeLists.txt",
    "cpp/**/*.cpp",
    "cpp/**/*.h",
    "cpp/**/*.hpp",
]
sdist.exclude = [
    "build/**",
    ".venv/**",
]

[tool.scikit-build.cmake.define]
# Override at install time, e.g.:
#   CXX=g++-16 CMAKE_ARGS="-DCMAKE_CXX_COMPILER=g++-16" pip install -e ".[native-dev]"
CMAKE_CXX_STANDARD = "26"
CMAKE_CXX_STANDARD_REQUIRED = "ON"
CMAKE_CXX_EXTENSIONS = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "django/__init__.py"
regex = '''__version__\s*=\s*["'](?P<value>[^"']+)["']'''
result = "{value}"

[tool.black]
target-version = ["py312"]
force-exclude = "tests/test_runner_apps/tagged/tests_syntax_error.py"

[tool.isort]
profile = "black"
default_section = "THIRDPARTY"
known_first_party = "django"
